<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 主渐变: indigo → violet → pink -->
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- 流光渐变 -->
    <linearGradient id="grad-shimmer" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.6)" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="32" cy="32" r="30" fill="url(#grad-main)" opacity="0.1">
    <animate attributeName="r" values="29;31;29" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 船体 -->
  <path d="M12 42 Q16 48 32 48 Q48 48 52 42 L48 36 Q40 40 32 40 Q24 40 16 36 Z"
        fill="url(#grad-main)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 主帆 -->
  <path d="M32 12 L32 36 L18 36 Q20 24 32 12Z"
        fill="url(#grad-main)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 副帆 -->
  <path d="M34 16 L34 36 L46 36 Q44 28 34 16Z"
        fill="url(#grad-main)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1;0,0" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.55;0.7;0.55" dur="3s" repeatCount="indefinite" begin="0.3s"/>
  </path>

  <!-- 桅杆 -->
  <line x1="32" y1="10" x2="32" y2="40" stroke="url(#grad-main)" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- 旗帜 -->
  <path d="M32 10 L38 13 L32 16" fill="#ec4899" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-1.5;0,0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M32 10 L38 13 L32 16;M32 10 L39 12.5 L32 16;M32 10 L38 13 L32 16" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 水波纹 -->
  <path d="M8 50 Q14 47 20 50 Q26 53 32 50 Q38 47 44 50 Q50 53 56 50"
        stroke="url(#grad-main)" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
    <animate attributeName="d"
             values="M8 50 Q14 47 20 50 Q26 53 32 50 Q38 47 44 50 Q50 53 56 50;M8 50 Q14 53 20 50 Q26 47 32 50 Q38 53 44 50 Q50 47 56 50;M8 50 Q14 47 20 50 Q26 53 32 50 Q38 47 44 50 Q50 53 56 50"
             dur="3s" repeatCount="indefinite"/>
  </path>

  <path d="M6 54 Q12 51 18 54 Q24 57 30 54 Q36 51 42 54 Q48 57 54 54 Q60 51 62 54"
        stroke="url(#grad-main)" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round">
    <animate attributeName="d"
             values="M6 54 Q12 51 18 54 Q24 57 30 54 Q36 51 42 54 Q48 57 54 54 Q60 51 62 54;M6 54 Q12 57 18 54 Q24 51 30 54 Q36 57 42 54 Q48 51 54 54 Q60 57 62 54;M6 54 Q12 51 18 54 Q24 57 30 54 Q36 51 42 54 Q48 57 54 54 Q60 51 62 54"
             dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 流光叠加 -->
  <circle cx="32" cy="32" r="28" fill="url(#grad-shimmer)" opacity="0.3"/>

  <!-- SVG 节点粒子 -->
  <circle cx="14" cy="20" r="1.2" fill="#8b5cf6" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" values="0.5;1.5;0.5" dur="4s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="50" cy="24" r="1" fill="#ec4899" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite" begin="1.3s"/>
    <animate attributeName="r" values="0.5;1.3;0.5" dur="4s" repeatCount="indefinite" begin="1.3s"/>
  </circle>
  <circle cx="46" cy="14" r="0.8" fill="#6366f1" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite" begin="2.6s"/>
    <animate attributeName="r" values="0.3;1.2;0.3" dur="4s" repeatCount="indefinite" begin="2.6s"/>
  </circle>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>
</svg>
