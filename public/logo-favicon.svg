<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="32" cy="32" r="30" fill="url(#grad-main)" opacity="0.1"/>

  <!-- 船体 -->
  <path d="M12 42 Q16 48 32 48 Q48 48 52 42 L48 36 Q40 40 32 40 Q24 40 16 36 Z"
        fill="url(#grad-main)" filter="url(#shadow)"/>

  <!-- 主帆 -->
  <path d="M32 12 L32 36 L18 36 Q20 24 32 12Z"
        fill="url(#grad-main)" opacity="0.9"/>

  <!-- 副帆 -->
  <path d="M34 16 L34 36 L46 36 Q44 28 34 16Z"
        fill="url(#grad-main)" opacity="0.6"/>

  <!-- 桅杆 -->
  <line x1="32" y1="10" x2="32" y2="40" stroke="url(#grad-main)" stroke-width="2" stroke-linecap="round"/>

  <!-- 旗帜 -->
  <path d="M32 10 L38 13 L32 16" fill="#ec4899" opacity="0.8"/>

  <!-- 水波纹 -->
  <path d="M8 50 Q14 47 20 50 Q26 53 32 50 Q38 47 44 50 Q50 53 56 50"
        stroke="url(#grad-main)" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>

  <path d="M6 54 Q12 51 18 54 Q24 57 30 54 Q36 51 42 54 Q48 57 54 54 Q60 51 62 54"
        stroke="url(#grad-main)" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round"/>

  <!-- SVG 节点粒子 -->
  <circle cx="14" cy="20" r="1.2" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="50" cy="24" r="1" fill="#ec4899" opacity="0.5"/>
  <circle cx="46" cy="14" r="0.8" fill="#6366f1" opacity="0.4"/>
</svg>
